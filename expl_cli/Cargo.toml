[package]
name = "expl_cli"
description = "The expl command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "expl"
path = "src/main.rs"

[dependencies]
expl_runtime.workspace = true
expl_core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "internal-logs"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
expl_core.workspace = true

[lints]
workspace = true
