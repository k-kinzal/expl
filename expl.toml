# expl declaration for developing expl with expl. See `expl --help`.
#
# Each [agent.<name>] is started as processes (`expl run <name>`, or
# `expl up` for `replicas` of every agent). An agent reacts to the graph
# events of its role:
#   exploration — goal.added, node.evaluated, origin.advanced → proposes steps;
#                 when idle, every `revisit_cooldown` seconds it explores again
#                 from a random starting point (node.revisited)
#   planning    — node.proposed/evaluated/failed, goal.retired, origin.advanced → paths and priorities
#   execution   — node.ready                                   → commits on the step's branch
#   evaluation  — node.completed, origin.advanced → verdicts against goals
#
# `driver` selects how the CLI is spoken to:
#   claude_code  — `claude --print --output-format json --json-schema ...`
#   codex        — `codex exec --output-schema ... --output-last-message ...`
#   cursor_agent — `cursor-agent --print --output-format json ...`
#   generic      — any command: prompt on stdin, JSON response on stdout
#
# Exploration, planning and evaluation are routed across Claude Code and
# Codex (`[[agent.<name>.alternative]]`): each invocation goes to the next CLI in turn and falls over to the
# other when one fails. Execution is Cursor Agent on Claude Opus 5.5.
#
# All agents share one cargo target directory so that every worktree does
# not rebuild the dependencies (gpui above all) from scratch.
#
# Every agent runs one process (replicas = 1): exploration takes longer, but
# token use never spikes.
#
# Agents run unattended inside expl-owned git worktrees, so these let the
# CLIs edit files and run commands without asking.

# The default branch. Merge the candidates you choose into it with git;
# running processes notice it moved, the origin follows, and exploration
# starts again from there.
trunk = "main"

# Exploration is two agents routed by `weight` (each event goes to one of
# them, 4:1): `explorer` searches where the goal promises the most;
# `fringe` widens the frame — niche directions inside the goal nobody asked
# for, and counterexamples that would work against it. Both enumerate
# broadly; the planner ranks and weeds out.

[agent.explorer]
role = "exploration"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
weight = 4
breadth = 8
max_pending = 20
revisit_cooldown = 600
instructions = """
AGENTS.md describes the vision and architecture. Enumerate the directions that look most
promising for moving expl toward the goal: different mechanisms, different parts of the
system, different trade-offs.
Every step must change Rust code, tests, or configuration. Markdown files (*.md) are
frozen: never propose a step whose purpose is to add, edit, or delete a .md file.
"""

[[agent.explorer.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[agent.fringe]
role = "exploration"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
weight = 1
breadth = 8
max_pending = 20
instructions = """
AGENTS.md describes the vision and architecture. Explore the fringe of the problem space on
purpose — what a mainstream search toward the goal would never propose:
- niche directions that stay inside the goal's frame but nobody asked for;
- unusual trade-offs, inversions of current design decisions, extreme simplifications;
- counterexamples: changes that look plausible but would work against the goal. Say in the
  objective which part of the goal they would harm and how evaluating them would show it.
Start each title with "Fringe:" or "Counterexample:". Every step must still be a concrete,
verifiable change to Rust code, tests, or configuration. Markdown files (*.md) are frozen:
never propose a step whose purpose is to add, edit, or delete a .md file.
"""

[[agent.fringe.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[agent.planner]
role = "planning"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
instructions = """
Markdown files (*.md) are frozen. Prune any step whose purpose is to add, edit, or delete a .md
file. Exploration enumerates broadly on purpose: rank unlikely or counterproductive steps low
instead of pruning them, and prune duplicates. Steps titled "Fringe:" are deliberate outliers
and "Counterexample:" steps are expected to work against the goal — keep them at low priority
unless the judgements give a reason to try one. Prefer small, independently verifiable steps;
join paths only when their changes are complementary.
"""

[[agent.planner.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[agent.executor]
role = "execution"
driver = "cursor_agent"
command = ["cursor-agent"]
args = ["--model", "claude-opus-5-5-high", "--force", "--trust", "--sandbox", "disabled"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
instructions = """
This repository is expl itself (Rust workspace: expl_core, expl_cli, expl_ui). Follow AGENTS.md:
keep its nouns and responsibilities, document public items, keep errors typed (thiserror).
Markdown files (*.md) are frozen: do not add, modify, or delete any .md file, even if the task
seems to ask for it.
Before finishing, `cargo fmt`, `cargo clippy --all-targets`, and `cargo test` must pass;
report succeeded=false if they do not.
"""

[agent.evaluator]
role = "evaluation"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
instructions = """
Run `cargo clippy --all-targets` and `cargo test`. A goal is never satisfied by a branch on
which either fails. A branch that adds, modifies, or deletes any Markdown (*.md) file satisfies
no goal: check with `git diff --name-only "$(git merge-base HEAD main)" HEAD -- '*.md'`, which
must print nothing. Judge naming and responsibilities against AGENTS.md as part of quality.
"""

[[agent.evaluator.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]
