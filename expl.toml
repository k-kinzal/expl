# expl declaration for developing expl with expl. See `expl --help`.
#
# Each [consumer.<name>] subscribes to graph events and defines what to do
# when they arrive. `expl run <name>` starts a worker and `expl up` starts
# the declared replicas.
#
# `driver` selects how the CLI is spoken to:
#   claude_code  — `claude --print --output-format json --json-schema ...`
#   codex        — `codex exec --output-schema ... --output-last-message ...`
#   cursor_agent — `cursor-agent --print --output-format json ...`
#   generic      — any command: prompt on stdin, JSON response on stdout
#
# Claude Code and Codex take turns supplying handler responses
# (`[[consumer.<name>.alternative]]`). A failed invocation falls over to
# the other CLI.
#
# Clones reuse Cargo build artifacts through CARGO_TARGET_DIR. Evaluation
# uses a separate target directory.
#
# Every consumer has one worker. The shared router allows one reaction at a time
# across the whole cycle to keep token use low while we observe it.
#
# Agents run unattended inside private clones expl makes for them, so these
# let the CLIs edit files and run commands without asking.

# The default branch. Merge the hypotheses you choose into it with git;
# running processes notice it moved, the origin follows, and exploration
# starts again from there.
trunk = "main"

# GPU server OTLP HTTP receiver for expl's own exploration.
[telemetry]
endpoint = "http://192.168.10.4:4318"

# Markdown is frozen while exploring: a step's commit keeps every *.md as
# it was where the step started, whatever the verifier did to it.
[workspace]
frozen = ["*.md"]

# Keep the existing group names so the stored assignments still apply.
[routing]
exploration = "all"
planning = "all"
verification = "all"
evaluation = "all"

[router.all]
targets = ["explorers", "planner", "verifier", "evaluator"]
policy = "first"
concurrency = 1

# Each exploration event goes to one perspective. The explorer searches
# from a node, the fringe widens the search, and the surveyor reads the graph.
[router.explorers]
targets = ["explorer", "fringe", "surveyor"]
policy = "weighted"
weights = { explorer = 4, fringe = 1, surveyor = 1 }
concurrency = 1

[consumer.explorer]
on = ["goal.added", "node.evaluated", "node.failed", "origin.advanced", "node.revisited"]
handler = "exploration"
group = "exploration"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
concurrency = 1
breadth = 8
speculate = true
revisit_cooldown = 600
instructions = """
AGENTS.md describes the vision and architecture. Enumerate the directions that look most
promising for moving expl toward the goal: different mechanisms, different parts of the
system, different trade-offs.
Every step must be a change to Rust code, tests, or configuration, or an investigation that
answers a question about the code or its behaviour (does a premise hold, why did a step fail,
what would a change affect). Markdown files (*.md) are frozen: never propose a step whose
purpose is to add, edit, or delete a .md file.
"""

[[consumer.explorer.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[consumer.fringe]
on = ["goal.added", "node.evaluated", "node.failed", "origin.advanced", "node.revisited"]
handler = "exploration"
group = "exploration"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
concurrency = 1
breadth = 8
speculate = true
instructions = """
AGENTS.md describes the vision and architecture. Explore the fringe of the problem space on
purpose — what a mainstream search toward the goal would never propose:
- niche directions that stay inside the goal's frame but nobody asked for;
- unusual trade-offs, inversions of current design decisions, extreme simplifications;
- counterexamples: changes that look plausible but would work against the goal. Say in the
  objective which part of the goal they would harm and how evaluating them would show it.
Start each title with "Fringe:" or "Counterexample:". Every step must still be a concrete,
verifiable change to Rust code, tests, or configuration, or an investigation that answers a
question about the code (for example, whether a design assumption actually holds). Markdown
files (*.md) are frozen:
never propose a step whose purpose is to add, edit, or delete a .md file.
"""

[[consumer.fringe.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[consumer.surveyor]
on = ["goal.added", "node.evaluated", "node.failed", "origin.advanced", "node.revisited"]
handler = "exploration"
group = "exploration"
scope = "graph"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
concurrency = 1
breadth = 8
instructions = """
AGENTS.md describes the vision and architecture. You see the whole map at once: look for what
explorations from single nodes cannot see — goals or parts of goals no path covers, separate
paths that would be stronger joined, causes shared by several failures or weak evaluations,
assumptions all paths share. Start each title with "Survey:". Every step must be a concrete,
verifiable change to Rust code, tests, or configuration, or an investigation that answers a
question about the code. Markdown files (*.md) are frozen: never propose a step whose purpose
is to add, edit, or delete a .md file.
"""

[[consumer.surveyor.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[consumer.planner]
on = ["node.proposed", "node.evaluated", "node.failed", "goal.retired", "origin.advanced"]
handler = "planning"
group = "planning"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
concurrency = 1
instructions = """
Markdown files (*.md) are frozen. Prune any step whose purpose is to add, edit, or delete a .md
file. Exploration enumerates broadly on purpose: rank unlikely or counterproductive steps low
instead of pruning them, and prune duplicates. Steps titled "Fringe:" are deliberate outliers
and "Counterexample:" steps are expected to work against the goal — keep them at low priority
unless the judgements give a reason to try one. Prefer small, independently verifiable steps;
join paths only when their changes are complementary.
"""

[[consumer.planner.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[consumer.verifier]
on = ["node.ready"]
handler = "verification"
group = "verification"
# Claude Code first, Codex when it fails. (Cursor Agent, used before, hit its
# monthly Opus usage limit until 2026-12-17.)
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
concurrency = 1
instructions = """
This repository is expl itself (Rust workspace: expl_core, expl_cli, expl_ui). Follow AGENTS.md:
keep its nouns and responsibilities, document public items, keep errors typed (thiserror).
For a change: before finishing, `cargo fmt`, `cargo clippy --all-targets`, and `cargo test`
must pass; report succeeded=false if they do not. For an investigation (a question to answer):
change nothing, and back the answer with evidence from the code, builds, or tests you ran.
"""

[[consumer.verifier.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[consumer.evaluator]
on = ["node.completed", "node.failed", "origin.advanced"]
handler = "evaluation"
group = "evaluation"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
# Its own target directory: sharing the verifier's, a test run could pick up
# a binary another clone's build had just overwritten.
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target-evaluator" }
replicas = 1
concurrency = 1
instructions = """
For a change: run `cargo clippy --all-targets` and `cargo test`. A goal is never satisfied by a
branch on which either fails. For an investigation: there is nothing to build; check that the
evidence holds against the code in the working directory, and judge whether the findings settle
the goal. Judge naming and responsibilities against AGENTS.md as part of quality.
"""

[[consumer.evaluator.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]
