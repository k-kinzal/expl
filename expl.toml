# expl declaration for developing expl with expl. See `expl --help`.
#
# Each [agent.<name>] is started as processes (`expl run <name>`, or
# `expl up` for `replicas` of every agent). An agent reacts to the graph
# events of its role:
#   exploration — goal.added, node.evaluated, origin.advanced → proposes steps
#   planning    — node.proposed/evaluated/failed, goal.retired, origin.advanced → paths and priorities
#   execution   — node.ready                                   → commits on the step's branch
#   evaluation  — node.completed, origin.advanced → verdicts against goals
#
# `driver` selects how the CLI is spoken to:
#   claude_code  — `claude --print --output-format json --json-schema ...`
#   codex        — `codex exec --output-schema ... --output-last-message ...`
#   cursor_agent — `cursor-agent --print --output-format json ...`
#   generic      — any command: prompt on stdin, JSON response on stdout
#
# Exploration, planning and evaluation are routed across Claude Code and
# Codex: each invocation goes to the next CLI in turn and falls over to the
# other when one fails. Execution is Cursor Agent on Claude Opus 5.5.
#
# All agents share one cargo target directory so that every worktree does
# not rebuild the dependencies (gpui above all) from scratch.
#
# Agents run unattended inside expl-owned git worktrees, so these let the
# CLIs edit files and run commands without asking.

# The default branch. Merge the candidates you choose into it with git;
# running processes notice it moved, the origin follows, and exploration
# starts again from there.
trunk = "main"

[agent.explorer]
role = "exploration"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
breadth = 3
max_pending = 6
instructions = """
AGENTS.md describes the vision and architecture; propose steps that move expl toward it.
Every step must change Rust code, tests, or configuration. Markdown files (*.md) are
frozen: never propose a step whose purpose is to add, edit, or delete a .md file.
"""

[[agent.explorer.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[agent.planner]
role = "planning"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
instructions = """
Markdown files (*.md) are frozen. Prune any step whose purpose is to add, edit, or delete a .md
file. Prefer small, independently verifiable steps; join paths only when their changes are
complementary.
"""

[[agent.planner.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]

[agent.executor]
role = "execution"
driver = "cursor_agent"
command = ["cursor-agent"]
args = ["--model", "claude-opus-5-5-high", "--force", "--trust", "--sandbox", "disabled"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 2
instructions = """
This repository is expl itself (Rust workspace: expl_core, expl_cli, expl_ui). Follow AGENTS.md:
keep its nouns and responsibilities, document public items, keep errors typed (thiserror).
Markdown files (*.md) are frozen: do not add, modify, or delete any .md file, even if the task
seems to ask for it.
Before finishing, `cargo fmt`, `cargo clippy --all-targets`, and `cargo test` must pass;
report succeeded=false if they do not.
"""

[agent.evaluator]
role = "evaluation"
driver = "claude_code"
command = ["claude"]
args = ["--permission-mode", "bypassPermissions"]
env = { CARGO_TARGET_DIR = "/Users/ab/Projects/expl/.expl/cargo-target" }
replicas = 1
instructions = """
Run `cargo clippy --all-targets` and `cargo test`. A goal is never satisfied by a branch on
which either fails. A branch that adds, modifies, or deletes any Markdown (*.md) file satisfies
no goal: check with `git diff --name-only "$(git merge-base HEAD main)" HEAD -- '*.md'`, which
must print nothing. Judge naming and responsibilities against AGENTS.md as part of quality.
"""

[[agent.evaluator.alternative]]
driver = "codex"
command = ["codex"]
args = ["--dangerously-bypass-approvals-and-sandbox"]
